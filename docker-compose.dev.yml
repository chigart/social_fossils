services:
  frontend:
    build:
      context: ./frontend
      target: build
    command:
      - npm
      - run
      - dev
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  backend:
    command:
      - sh
      - -c
      - alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - uploads:/uploads

  airflow-scheduler:
    volumes:
      - ./airflow:/airflow
      - ./backend:/app
      - airflow_logs:/airflow/logs
      - uploads:/uploads
      - airflow_secrets_shared:/run/airflow-secrets

  airflow-dag-processor:
    volumes:
      - ./airflow:/airflow
      - ./backend:/app
      - airflow_logs:/airflow/logs
      - uploads:/uploads
      - airflow_secrets_shared:/run/airflow-secrets

  airflow-api:
    volumes:
      - ./airflow:/airflow
      - ./backend:/app
      - airflow_logs:/airflow/logs
      - uploads:/uploads
      - airflow_secrets_shared:/run/airflow-secrets

volumes:
  frontend_node_modules:
