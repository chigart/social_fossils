services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-social_fossils}:${POSTGRES_PASSWORD:-local-only}@db:5432/${POSTGRES_DB:-social_fossils}
      AIRFLOW_BASE_URL: http://airflow-api:8080
      UPLOAD_STAGING_DIR: /uploads
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    command:
      - sh
      - -c
      - alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
      - uploads:/uploads
    depends_on:
      db:
        condition: service_healthy
      airflow-api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-social_fossils}
      POSTGRES_USER: ${POSTGRES_USER:-social_fossils}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  airflow-db:
    image: postgres:17
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U airflow -d airflow
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  airflow-init:
    image: apache/airflow:3.3.2-python3.12
    entrypoint: /bin/bash
    user: "0:0"
    command:
      - -c
      - |
        set -e
        mkdir -p /run/airflow-secrets
        if [ ! -s /run/airflow-secrets/jwt_secret ]; then
          python -c 'from pathlib import Path; import secrets; Path("/run/airflow-secrets/jwt_secret").write_text(secrets.token_urlsafe(64))'
        fi
        chown airflow:0 /run/airflow-secrets/jwt_secret
        chmod 640 /run/airflow-secrets/jwt_secret
        su -p airflow -s /bin/bash -c 'export HOME=/home/airflow; airflow db migrate'
    environment:
      AIRFLOW__CORE__DAGS_FOLDER: /airflow/dags
      AIRFLOW__CORE__BASE_LOG_FOLDER: /airflow/logs
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__UNIT_TEST_MODE: "False"
      AIRFLOW__CORE__ENABLE_XCOM_PICKLING: "True"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
    volumes:
      - ./airflow:/airflow
      - airflow_logs:/airflow/logs
      - airflow_secrets_shared:/run/airflow-secrets
    depends_on:
      airflow-db:
        condition: service_healthy

  airflow-scheduler:
    image: apache/airflow:3.3.2-python3.12
    entrypoint: /airflow/entrypoint.sh
    command: scheduler
    environment:
      AIRFLOW__CORE__DAGS_FOLDER: /airflow/dags
      AIRFLOW__CORE__BASE_LOG_FOLDER: /airflow/logs
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api:8080/execution/
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__UNIT_TEST_MODE: "False"
      AIRFLOW__CORE__ENABLE_XCOM_PICKLING: "True"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-social_fossils}:${POSTGRES_PASSWORD:-local-only}@db:5432/${POSTGRES_DB:-social_fossils}
      UPLOAD_STAGING_DIR: /uploads
    volumes:
      - ./airflow:/airflow
      - ./backend:/app
      - airflow_logs:/airflow/logs
      - uploads:/uploads
      - airflow_secrets_shared:/run/airflow-secrets
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-db:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

  airflow-dag-processor:
    image: apache/airflow:3.3.2-python3.12
    entrypoint: /airflow/entrypoint.sh
    command: dag-processor
    environment:
      AIRFLOW__CORE__DAGS_FOLDER: /airflow/dags
      AIRFLOW__CORE__BASE_LOG_FOLDER: /airflow/logs
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__UNIT_TEST_MODE: "False"
      AIRFLOW__CORE__ENABLE_XCOM_PICKLING: "True"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-social_fossils}:${POSTGRES_PASSWORD:-local-only}@db:5432/${POSTGRES_DB:-social_fossils}
      UPLOAD_STAGING_DIR: /uploads
    volumes:
      - ./airflow:/airflow
      - ./backend:/app
      - airflow_logs:/airflow/logs
      - uploads:/uploads
      - airflow_secrets_shared:/run/airflow-secrets
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-db:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped

  airflow-api:
    image: apache/airflow:3.3.2-python3.12
    entrypoint: /airflow/entrypoint.sh
    command: api-server
    environment:
      AIRFLOW__CORE__DAGS_FOLDER: /airflow/dags
      AIRFLOW__CORE__BASE_LOG_FOLDER: /airflow/logs
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__UNIT_TEST_MODE: "False"
      AIRFLOW__CORE__ENABLE_XCOM_PICKLING: "True"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-social_fossils}:${POSTGRES_PASSWORD:-local-only}@db:5432/${POSTGRES_DB:-social_fossils}
      UPLOAD_STAGING_DIR: /uploads
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./airflow:/airflow
      - ./backend:/app
      - airflow_logs:/airflow/logs
      - uploads:/uploads
      - airflow_secrets_shared:/run/airflow-secrets
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v2/monitor/health')"
      interval: 10s
      timeout: 5s
      retries: 18
    restart: unless-stopped

  adminer:
    image: adminer:5
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  airflow_logs:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=256m,mode=1777"
  airflow_secrets_shared:
    driver: local
  uploads:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=1g,mode=1777"
  frontend_node_modules:
